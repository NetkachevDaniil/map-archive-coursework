services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: orientmaps
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    # Порт БД не публикуется наружу — доступ только из docker-сети (web -> db).
    # Для локальной отладки с хоста: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d orientmaps"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads

volumes:
  postgres_data:
