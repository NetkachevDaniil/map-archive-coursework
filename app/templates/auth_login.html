{% extends "base.html" %}
{% block content %}
<section class="form-card">
    <h2>Вход</h2>
    {% if error %}<div class="error-box">{{ error }}</div>{% endif %}
    <form method="post" action="/auth/login" class="v-form">
        <label>Логин или email <input name="login_or_email" required autocomplete="username"></label>
        <label>Пароль <input type="password" name="password" required autocomplete="current-password"></label>
        <button type="submit">Войти</button>
    </form>
    <p>Нет аккаунта? <a href="/auth/register">Зарегистрироваться</a></p>
</section>
{% endblock %}
