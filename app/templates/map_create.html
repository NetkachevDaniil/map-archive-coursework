{% extends "base.html" %}

{% block content %}

<section class="form-card">

    <h2>Добавление новой карты</h2>

    {% if error %}<div class="error-box">{{ error }}</div>{% endif %}

    <form method="post" action="/maps/create" enctype="multipart/form-data" class="v-form">

        <label>Название карты <input name="title" value="{{ form_data.title if form_data else '' }}" required></label>

        <label>Регион (обязательно)

            <select name="region_name" id="regionField" required>

                <option value="">Выберите регион</option>

                {% for region in regions %}

                    <option value="{{ region.name }}" {% if form_data and form_data.region_name == region.name %}selected{% endif %}>{{ region.name }}</option>

                {% endfor %}

            </select>

        </label>

        <label>Координаты центра местности

            <input id="coordinatesField" name="coordinates" value="{{ form_data.coordinates if form_data else '' }}" placeholder="55.92747, 37.69615">

            <small class="field-hint">Необязательно. Если неизвестно — оставьте пустым, в карточке будет «—».</small>

        </label>

        <label>Соревнование <input name="event_name" value="{{ form_data.event_name if form_data else '' }}"></label>

        <label>Год <input id="yearField" type="number" name="year_of_event" value="{{ form_data.year_of_event if form_data else '' }}"></label>

        <label>Масштаб <input type="number" name="scale_denominator" value="{{ form_data.scale_denominator if form_data else '' }}" placeholder="10000"></label>

        <label>Автор-составитель карты <input name="cartographer" value="{{ form_data.cartographer if form_data else '' }}" placeholder="ФИО"></label>

        <label>Правообладатель <input name="rights_holder" value="{{ form_data.rights_holder if form_data else '' }}" placeholder="ФИО или организация"></label>

        <label>Описание <textarea class="field-fixed" name="description" rows="4">{{ form_data.description if form_data else '' }}</textarea></label>

        <label class="file-input">

            <span class="file-input-label">Выбрать файл карты</span>

            <input type="file" name="image" accept="image/*" required data-file-label="Файл не выбран">

            <span class="file-input-name">Файл не выбран</span>

        </label>

        <button type="button" onclick="openSimilarInNewTab()" class="secondary-btn">Проверить похожие карты в новой вкладке</button>

        <button type="submit">Опубликовать</button>

    </form>

    {% if similar_posts %}

        <div class="info-box">

            Похожие карты уже есть в архиве:

            {% for item in similar_posts %}

                <div><a class="table-link" href="/maps/{{ item.id }}" target="_blank">{{ item.title }}</a></div>

            {% endfor %}

        </div>

    {% endif %}

</section>

<script>

function openSimilarInNewTab() {

    const region = document.getElementById('regionField').value || '';

    const url = `/catalog?tab=maps&region=${encodeURIComponent(region)}&sort=published_desc`;

    window.open(url, '_blank');

}

</script>

{% endblock %}
