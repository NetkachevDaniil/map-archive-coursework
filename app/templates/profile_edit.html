{% extends "base.html" %}
{% block content %}
<section class="form-card">
    <h2>Редактирование профиля</h2>
    {% if error %}<div class="error-box">{{ error }}</div>{% endif %}
    <form method="post" action="/profile/me/edit" enctype="multipart/form-data" class="v-form">
        <label>Имя / отображаемое имя
            <input name="full_name" value="{{ profile_user.full_name or '' }}" required>
        </label>
        <label>О себе
            <textarea name="bio" rows="4" placeholder="Кратко о себе, клуб, интересы...">{{ profile_user.bio or '' }}</textarea>
        </label>
        <label class="file-input">
            <span class="file-input-label">Выбрать аватар</span>
            <input type="file" name="avatar" accept="image/*" data-file-label="Аватар не выбран">
            <span class="file-input-name">Текущий аватар сохранён</span>
        </label>
        <div class="form-actions">
            <button type="submit">Сохранить</button>
            <a class="btn-secondary" href="/profile/me">Отмена</a>
        </div>
    </form>
</section>
{% endblock %}
