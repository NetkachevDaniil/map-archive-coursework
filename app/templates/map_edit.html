{% extends "base.html" %}
{% block content %}
<section class="form-card">
    <h2>Редактирование карты</h2>
    {% if request.query_params.get("error") == "region" %}
        <div class="error-box">Укажите регион карты.</div>
    {% elif request.query_params.get("error") == "coordinates" %}
        <div class="error-box">Координаты должны быть в формате: 55.92747, 37.69615</div>
    {% endif %}
    <form method="post" action="/maps/{{ post.id }}/edit" class="v-form">
        <label>Название <input name="title" value="{{ post.title }}" required></label>
        <label>Регион
            <select name="region_name" required>
                {% for region in regions %}
                    <option value="{{ region.name }}" {% if post.region and post.region.name == region.name %}selected{% endif %}>{{ region.name }}</option>
                {% endfor %}
            </select>
        </label>
        <label>Координаты <input name="coordinates" value="{{ post.coordinates or '' }}" placeholder="55.92747, 37.69615"></label>
        <label>Соревнование <input name="event_name" value="{{ post.event.name if post.event else '' }}"></label>
        <label>Год <input type="number" name="year_of_event" value="{{ post.year_of_event or '' }}"></label>
        <label>Масштаб <input type="number" name="scale_denominator" value="{{ post.scale_denominator or '' }}"></label>
        <label>Автор-составитель <input name="cartographer" value="{{ post.cartographer or '' }}"></label>
        <label>Правообладатель <input name="rights_holder" value="{{ post.rights_holder or '' }}"></label>
        <label>Описание <textarea name="description" rows="4">{{ post.description }}</textarea></label>
        <button type="submit">Сохранить</button>
    </form>
</section>
{% endblock %}
